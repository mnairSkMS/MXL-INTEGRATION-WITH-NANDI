[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:transcoder_api]
command=/opt/venv/bin/uvicorn transcoder_api:app --host 0.0.0.0 --port %(ENV_API_PORT)s --no-server-header
autostart=false
autorestart=unexpected
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
dependent_startup=true
dependent_startup_wait_for=preload_db:exited

[program:transcoder]
command=/opt/utpl/bin/transcoder -c %(ENV_TRANSCODER_CONFIG_PATH)s -l %(ENV_TRANSCODER_LICENSE_PATH)s -b %(ENV_DB_PATH)s
autostart=false
autorestart=unexpected
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stopsignal=INT
dependent_startup=true
dependent_startup_wait_for=preload_db:exited

[program:rtmp_relay]
command=/opt/utpl/bin/mediamtx /opt/utpl/etc/mediamtx.yml
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:preload_db]
command=/opt/venv/bin/preload_db %(ENV_INIT_DATA)s
autostart=false
autorestart=false
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
dependent_startup=true
# startsecs=0 with autorestart=false means any exit lands in EXITED rather than
# BACKOFF or FATAL, and supervisord-dependent-startup keys off the event name
# alone. A failed preload_db therefore still releases the programs waiting on
# it: the channel starts on its previously saved playlist instead of going dark.
startsecs=0


[eventlistener:dependentstartup]
command=/opt/venv/bin/supervisord-dependent-startup
autostart=true
autorestart=unexpected
startsecs=0
startretries=0
exitcodes=0,2
events=PROCESS_STATE
stderr_logfile=/dev/fd/1
stderr_logfile_maxbytes = 0
