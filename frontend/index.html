<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skandha Transcoder — Channel Control</title>
    <!--
      Loaded non-blocking. An appliance is routinely on an isolated network where
      fonts.googleapis.com is unreachable, and a plain stylesheet link there holds up first
      paint until the request times out. The stacks in styles/index.css name local fallbacks,
      so the page is fully legible whether or not this ever arrives.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
