name: skandha-transcoder

# Two switchable sources, one SRT output.
#
#   primary  srt://59.152.57.98:7050 (caller) - live H.264 1080i25 + MP2 stereo
#   backup   the managed file queue (MEDIA_DIR files, edited at /switch or /operator)
#
# Both live in one managed PlaylistInput (the engine parses only inputs[0]). The SRT URI is
# pinned ahead of the queue by MANAGED_PLAYLIST_LIVE_URIS, so queue edits never drop it. The
# engine starts on the SRT entry; if it underruns the playlist moves to the first file by
# itself, and after the last file it loops back to SRT.
#
# Output: H.264 High 1080p25 6 Mbps (2 s GOP) + AAC 48 kHz stereo in MPEG-TS, served as an
# SRT listener. Receivers pull  srt://<this-host>:9092?mode=caller
#
# Demo page: http://127.0.0.1:8080/switch - Live / Playlist buttons (Playlist always starts at
# the first queued file), on-air status, switch timing, and the queue editor (add from the
# media library, upload, reorder, remove).
#
# The queue is seeded once from config/srt_playlist_switch_seed.m3u8 into this channel's own
# database (DB_PATH); after that the database is the source of truth. Delete
# runtime/srt-playlist-switch.sqlite to reseed.
#
# Replaces the other compose files on this host (same project and container name):
#   docker compose -f docker-compose.playlist.yml down
#   docker compose -f docker-compose.srt-playlist-switch.yml up -d

services:
  transcoder:
    # Includes the live-item rebase in PlaylistInput (switching back to SRT mid-run).
    image: skandha-transcoder:mbb
    container_name: skandha-transcoder
    restart: unless-stopped
    ports:
      # The management API is unauthenticated and PUT /config writes; keep it on loopback
      # unless UI_BIND is set to a trusted interface.
      - "${UI_BIND:-127.0.0.1}:8080:8080"
      # SRT output on every interface. No passphrase in this config schema, so restrict
      # 9092/udp at the firewall to the receivers' subnet.
      - "9092:9092/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_PORT: "8080"
      MEDIA_DIR: /media/queue
      GRAPHICS_CATALOG_PATH: /runtime/graphics_catalog.json
      # Separate from the managed channel's database, so neither channel disturbs the other.
      DB_PATH: /runtime/srt-playlist-switch.sqlite
      MANAGED_PLAYLIST_ID: main
      PLAYLIST_SEED_FILE: /opt/utpl/channel/srt_playlist_switch_seed.m3u8
      # Must match the input URI in srt_playlist_switch.json.
      MANAGED_PLAYLIST_FILE: /runtime/srt-playlist-switch-managed.m3u8
      # Live sources pinned ahead of the file queue, whitespace-separated.
      MANAGED_PLAYLIST_LIVE_URIS: "srt://59.152.57.98:7050?mode=caller"
      HLS_DIR: /runtime/hls
      ENABLE_RUNDOWN_SERVICE: "false"
      TRANSCODER_CONFIG_PATH: /opt/utpl/channel/srt_playlist_switch.json
      TRANSCODER_LICENSE_PATH: /runtime/license/transcoder.lic
    volumes:
      # Writable: uploads from the queue editor land here.
      - ./media/queue:/media/queue
      - ./media/slates:/media/slates
      - ./runtime:/runtime
      - ./api/src/transcoder_api:/opt/venv/lib/python3.12/site-packages/transcoder_api:ro
      - ./config:/opt/utpl/channel
      - ./transcoder/license/prod/licenses/offline.lic:/opt/utpl/etc/transcoder.lic.seed:ro
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -d /runtime/license ]; then
          mkdir -p /runtime/license
          cp /opt/utpl/etc/transcoder.lic.seed "$$TRANSCODER_LICENSE_PATH"
        fi
        /usr/bin/supervisord &
        trap 'supervisorctl stop transcoder transcoder_api || true; exit 0' INT TERM
        wait
