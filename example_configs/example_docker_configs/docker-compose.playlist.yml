name: skandha-transcoder

services:
  transcoder:
    # Rebuild: docker compose -f docker-compose.playlist.yml build
    build:
      context: .
      dockerfile: docker/utpl-transcoder/Dockerfile
    image: skandha-transcoder:rtmp-test
    container_name: skandha-transcoder
    restart: unless-stopped
    ports:
      # Host-only. The management API here is unauthenticated and PUT /config
      # genuinely writes, so keep this on loopback.
      # Operator UI at http://127.0.0.1:8080/operator.
      - "127.0.0.1:8080:8080"
      # SRT output, published on every interface so LAN receivers can pull it:
      # srt://<this-host>:9092?mode=caller. The /udp suffix is required.
      # SRT has no passphrase in this config schema, so anyone who can reach the
      # host on 9092/udp can pull the programme. Restrict it at the firewall, or
      # bind this to one interface (e.g. "192.168.1.10:9092:9092/udp").
      - "9092:9092/udp"
      # Jio test SRT listener (jio_test.json output-1), loopback only: srt://127.0.0.1:9001?mode=caller.
      - "127.0.0.1:9001:9001/udp"
      # Jio test second SRT listener (jio_test.json output-1, second transport), published
      # on every interface so LAN receivers can pull srt://<this-host>:9002?mode=caller.
      # No passphrase in this config schema: restrict 9002/udp at the firewall, or bind it
      # to one interface (e.g. "192.168.1.10:9002:9002/udp").
      - "9002:9002/udp"
      # RTMP ingest relay: encoders publish to rtmp://<this-host>:1935/live/<stream-key>
      # and the engine reads it back over loopback. The stream key (16+ URL-safe characters,
      # generated by the channel form) is the only credential, so restrict this port at the
      # firewall if the encoders live on a known network. RTMPS needs a mounted
      # mediamtx.yml and cert - see docker/utpl-transcoder/mediamtx.yml.
      - "1935:1935"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_PORT: "8080"
      # Managed-playlist settings. Inert while the engine config is a live SRT
      # channel - the engine takes its source from the config's inputs, not from
      # here. preload_db and the operator UI still read them, so they are kept
      # for the moment config.json goes back to a pls+file:// input.
      MEDIA_DIR: /media/queue
      # The shipped catalog lives inside the API package, which is mounted read-only,
      # so uploads write to this copy in /runtime instead. Seeded from the packaged
      # one; a package upgrade will not update it, so diff them after an upgrade that
      # changes the shipped assets.
      GRAPHICS_CATALOG_PATH: /runtime/graphics_catalog.json
      DB_PATH: /runtime/managed-playlist.sqlite
      MANAGED_PLAYLIST_ID: main
      PLAYLIST_SEED_FILE: /media/queue/playlist.m3u8
      MANAGED_PLAYLIST_FILE: /runtime/main.m3u8
      # Served by the API at /hls. Must match the HLS output URI in config.json.
      HLS_DIR: /runtime/hls
      # Declarative source of truth for the playlist and its graphics. Applied
      # on every start and rewritten by every Publish.
      PLAYLIST_BOOTSTRAP_FILE: /opt/utpl/channel/channel.yml
      # "false" makes the file one-way: Publish goes on air without persisting.
      PLAYLIST_BOOTSTRAP_WRITEBACK: "true"
      # "true" exits preload_db non-zero when the file is rejected. Either way
      # the channel starts on its previously saved playlist.
      PLAYLIST_BOOTSTRAP_STRICT: "false"
      # Animated MOV catalog entries. Evaluation only - two acceptance criteria
      # fail as of 2026-09-01: ~840 ms of black on air (first frame arrives 21
      # frames late, tail truncated by the same) and ~19 MB retained per
      # start/stop cycle. Alpha and 25 fps cadence pass. See doc/codebase/27.
      ENABLE_VIDEO_GRAPHICS: "true"
      # Required by the declarative bootstrap: it writes rundown versions.
      ENABLE_RUNDOWN_SERVICE: "true"
      # Engine config, parsed once at start. It lives inside the bind-mounted
      # directory below rather than being mounted as a file of its own, because
      # PUT /config replaces it with an atomic rename and a single-file mount is
      # pinned to one inode. Note that route is unauthenticated on the published
      # port and now genuinely writes. Swap the file name to pick the channel:
      #   playlist_mxf_akamai_hls.json - Managed MXF playlist from
      #       channel.yml, pushed by HTTP PUT to Akamai MSL (stream 20000390,
      #       IP allow-list, no credentials) as two H.264 Main/AAC ladders,
      #       std_mdh-700300010 (144p-720p) and std_mdl-600300010 (144p-480p).
      #       No SRT output, so nothing listens on the published :9092.
      #   rtmp_to_srt_hls.json - in use here. Pulls rtmp://103.248.72.28:1935/live/Cook_Vook_Out
      #       (H.264 Main 1080p25 + AAC). One output, one x264 encode (1080p25 6 Mbps,
      #       2 s GOP, audio passed through), sent to an SRT listener on :9092 and to HLS in
      #       /runtime/hls (4 s segments), served to the LAN by the hls-lan service below.
      #       Video cannot be passthrough here: the engine rejects HLS in any config that
      #       has a passthrough video stream.
      #   jio_test.json        - previous channel. Jio test: live SRT contribution pulled
      #       from srt://59.152.57.110:10012 (caller), video passed through, audio
      #       re-encoded to E-AC-3 5.1 640k by dlbpatenc, SCTE-35 passthrough on PID 4269.
      #       Outputs: SRT listeners on :9001 (all interfaces) and :9002 (LAN), and SRT caller push to 43.205.222.56:5555.
      #       The listener is published on 9001/udp (see ports above), not 9092.
      #   playlist_mxf_srt.json - the same playlist, SRT listener only. Use
      #       docker-compose.mxf-srt.yml for it, which drops the RTMP port.
      #   config.json          - live SRT contribution. Pulls
      #       srt://103.248.72.80:8000 (caller) and fans out to HLS plus the SRT
      #       listener on :9000. The SRT leg carries Dolby Digital audio encoded
      #       by dlbpatenc (ac3, stereo, 192k); the HLS leg stays AAC.
      #   srt_to_hls_srt.json  - live SRT contribution from srt://103.248.72.28:10008,
      #       HLS only, with the audio passed through rather than re-encoded.
      # Both write HLS to /runtime/hls and share MEDIA_SEQUENCE state on disk.
      # Clear ./runtime/hls when switching, or the new channel restarts at
      # sequence 0 into the previous one's stale segments.
      # Required: the image default is /opt/utpl/etc/config.json, which does not
      # exist. Without this the engine exits 4 in a supervisord restart loop.
      TRANSCODER_CONFIG_PATH: /opt/utpl/channel/jio_test.json
      # Engine license, read once at start. PUT /license replaces it (atomic rename, then an
      # engine restart) and DELETE /license stops the engine and removes it, so it lives in the
      # writable /runtime directory rather than as a read-only file mount. Seeded from the
      # license mounted below only when /runtime/license does not exist yet, so a license the
      # operator deleted stays deleted across container restarts.
      TRANSCODER_LICENSE_PATH: /runtime/license/transcoder.lic
    volumes:
      # Writable for operator uploads. New uploads are not added to the static
      # M3U8 automatically; edit playlist.m3u8 first.
      - ./media/queue:/media/queue
      - ./media/graphics:/media/graphics
      # Slate media. The catalog at assets/slates_catalog.json decides what is
      # offered; the API serves these bytes to the engine over HTTP, which
      # downloads slate media with libcurl rather than reading it off disk.
      - ./media/slates:/media/slates
      - ./runtime:/runtime
      # Development checkout: makes the current FastAPI/operator source
      # available when reusing a previously built local image.
      - ./api/src/transcoder_api:/opt/venv/lib/python3.12/site-packages/transcoder_api:ro
      # The directory, not the file: a single-file bind mount is pinned to one
      # inode, and both writers here replace their file with an atomic rename -
      # Publish rewriting channel.yml, and PUT /config rewriting the engine
      # config named by TRANSCODER_CONFIG_PATH above.
      - ./config:/opt/utpl/channel
      # First-run seed for TRANSCODER_LICENSE_PATH only; the engine never reads this path.
      - ./transcoder/license/prod/licenses/offline.lic:/opt/utpl/etc/transcoder.lic.seed:ro
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -d /runtime/license ]; then
          mkdir -p /runtime/license
          cp /opt/utpl/etc/transcoder.lic.seed "$$TRANSCODER_LICENSE_PATH"
        fi
        /usr/bin/supervisord &
        trap 'supervisorctl stop transcoder transcoder_api || true; exit 0' INT TERM
        # The dependentstartup listener starts preload_db, then the API and
        # transcoder.
        wait

  # LAN delivery of the HLS output: http://<this-host>:8081/master.m3u8
  # Serves /runtime/hls only, read-only, GET/HEAD. The management API on :8080 stays
  # on loopback because it is unauthenticated and PUT /config writes. There is no
  # authentication here either: restrict 8081/tcp at the firewall if the LAN is not
  # trusted. /runtime is mounted whole (not ./runtime/hls) so the mount survives
  # the hls directory being moved aside when the channel is switched.
  hls-lan:
    image: skandha-transcoder:rtmp-test
    container_name: skandha-hls-lan
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./runtime:/runtime:ro
      - ./docker/utpl-transcoder/hls_lan_server.py:/opt/hls_lan_server.py:ro
    command: ["/opt/venv/bin/python", "/opt/hls_lan_server.py", "/runtime/hls", "8081"]
