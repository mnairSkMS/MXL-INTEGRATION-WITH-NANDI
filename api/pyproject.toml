[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
name = "transcoder_api"
version = "0.0.1"
authors = ["Michał"]
description = "Transcoder Rest API"
include = [
    "src/transcoder_api/assets/*.json",
    "src/transcoder_api/static/*.html",
    "src/transcoder_api/static/*.js",
    "src/transcoder_api/static/*.css",
    "src/transcoder_api/static/graphics/*",
    "src/transcoder_api/static/vendor/*",
    # The built channel UI. These patterns are not covered by the static/*.html and
    # static/*.js lines above, which match one level only - without them the wheel installs
    # an API whose /channel route 404s while the checkout it was built from looks fine.
    "src/transcoder_api/static/channel/index.html",
    "src/transcoder_api/static/channel/assets/*",
]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = "0.112.0"
SQLAlchemy = "2.0.31"
databases = "0.9.0"
pydantic = "2.8.2"
uvicorn = "0.30.5"
aiosqlite = "0.20.0"
python-multipart = "^0.0.20"
supervisord-dependent-startup = "1.4.0"
protobuf = "^4.21.7"
grpcio = "^1.51.1"
grpcio-tools = "^1.51.1"
PyYAML = "^6.0.1"

[tool.poetry.group.dev.dependencies]
poethepoet = "^0.27"
datamodel-code-generator = "^0.25"
black = "^24.8"
pytest = "^8.3"
mypy = "^1.11.1"
fastapi-code-generator = { version = "^0.5.1", optional = true }
httpx = "^0.27.0"
freezegun = "^1.5.1"
SQLAlchemy = { version = "2.0.31"}

[tool.poetry.extras]
routescodegen = ["fastapi-code-generator"]

[tool.datamodel-codegen]
target-python-version = "3.12"
input = "api.yaml"
output = "src/transcoder_api/model/rest_api.py"
output-model-type = "pydantic_v2.BaseModel"
input-file-type = "openapi"

[tool.poetry.scripts]
preload_db = 'transcoder_api.preload_db:run'

[tool.poe.tasks]

generate_model  = { cmd = "datamodel-codegen", help="Build code from OpenAPI Schema" }
generate_routes = { cmd = """fastapi-codegen -i api.yaml -o src/transcoder_api/ -t templates -m model/rest_api.py -p 3.12 -d pydantic_v2.BaseModel -r --specify-tags new""", help="Build code from OpenAPI Schema" }
generate_grpc   = { cmd = "python -m grpc_tools.protoc -I../transcoder/app/grpc/proto --python_out=src/transcoder_api/ --pyi_out=src/transcoder_api/ --grpc_python_out=src/transcoder_api/ transcoder.proto" }

codegen = [ "generate_model", "generate_grpc" ]

format = { cmd = "poetry run black .", help = "Code style formating with black" }
mypy = { cmd = "poetry run mypy .", help = "Static type checker" }
run = { cmd = "uvicorn transcoder_api:app --host 0.0.0.0 --port 8080 --reload --no-server-header", help = "Run dev server"}
pytest = { cmd = "poetry run pytest", help = "Run tests" }
all = ["codegen", "format", "mypy"]
test = ["pytest", "mypy"]

[tool.black]
line-length = 100

[tool.mypy]
ignore_missing_imports = true
exclude = ['rest_api\.py$']


[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
