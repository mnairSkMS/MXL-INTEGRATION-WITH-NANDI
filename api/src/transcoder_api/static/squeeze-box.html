<!doctype html><meta charset="utf-8"><title>Squeeze-box tool</title><style>body{font:16px system-ui;margin:2rem;max-width:60rem}canvas{border:1px solid #555;max-width:100%}input{margin:.25rem}</style><h1>Squeeze-box tool</h1><p>Load a graphic, draw the transparent programme window, then copy the generated catalog fragment. Values are emitted as fractions of the output frame (0&ndash;1), so one fragment is correct at every raster.</p><input id="file" type="file" accept="image/*"><canvas id="canvas" width="960" height="540"></canvas><p>x <input id="x" value="0"> y <input id="y" value="0"> width <input id="w" value="0"> height <input id="h" value="0"></p><pre id="out"></pre><button id="copy">Copy fragment</button><script>const $=s=>document.querySelector(s),c=$('#canvas'),x=c.getContext('2d');let box={x:0,y:0,w:0,h:0},start;function sync(){['x','y','w','h'].forEach(k=>$('#'+k).value=box[k]);const f=(v,d)=>Math.round(v/d*1e6)/1e6;$('#out').textContent=JSON.stringify({squeezeWindow:{x:f(box.x,c.width),y:f(box.y,c.height),width:f(box.w,c.width),height:f(box.h,c.height)}},null,2)}function draw(){x.clearRect(0,0,c.width,c.height);if(c.image)x.drawImage(c.image,0,0,c.width,c.height);x.strokeStyle='red';x.lineWidth=3;x.strokeRect(box.x,box.y,box.w,box.h)}$('#file').onchange=e=>{const img=new Image;img.onload=()=>{c.image=img;draw()};img.src=URL.createObjectURL(e.target.files[0])};c.onpointerdown=e=>start={x:e.offsetX,y:e.offsetY};c.onpointermove=e=>{if(!start)return;box={x:start.x,y:start.y,w:e.offsetX-start.x,h:e.offsetY-start.y};draw();sync()};c.onpointerup=()=>start=null;['x','y','w','h'].forEach(k=>$('#'+k).oninput=()=>{box[k]=+$('#'+k).value;draw();sync()});$('#copy').onclick=()=>navigator.clipboard.writeText($('#out').textContent);sync();</script>
